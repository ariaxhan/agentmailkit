<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taper piece - agentmailkit sample</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow-x:hidden}
  body{display:flex;flex-direction:column;min-height:100vh}
  section{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:100vh}
  section>*:not(style):not(script){flex:1 1 auto}
  .back{position:fixed;top:12px;left:14px;z-index:99;
        font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        color:#888;text-decoration:none;mix-blend-mode:difference}
</style></head><body>
<a class="back" href="../index.html">&larr; all samples</a>
<section data-date='2026-07-23' data-type='research-digest'>
<style>
.tpr823{min-height:100vh;background:#0a0a0c;color:#e8e4da;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:crosshair;}
.tpr823 .hdr{position:absolute;top:6vh;left:0;right:0;text-align:center;letter-spacing:.5em;font-size:11px;color:#5a5850;text-transform:uppercase;}
.tpr823 .cnt{position:absolute;bottom:6vh;left:0;right:0;text-align:center;font-size:11px;color:#5a5850;letter-spacing:.15em;}
.tpr823 .cnt b{color:#e8e4da;font-weight:normal;}
.tpr823 .grid{display:grid;gap:14px;}
.tpr823 .d{width:8px;height:8px;border-radius:50%;background:#232226;transition:background .6s ease,transform .6s ease,box-shadow .6s ease;}
.tpr823 .d.near{background:#3a3830;transform:scale(1.3);}
.tpr823 .d.lit{background:#e8c76a;box-shadow:0 0 10px 2px rgba(232,199,106,.5);transform:scale(1.6);}
.tpr823 .msg{position:absolute;font-size:10px;color:#8a8578;letter-spacing:.3em;top:12vh;opacity:0;transition:opacity 1.2s ease;text-align:center;left:0;right:0;}
.tpr823 .msg.on{opacity:1;}
</style>
<div class="tpr823" id="t823">
  <div class="hdr">bookmarked, not yet run</div>
  <div class="msg" id="t823m">the click makes it real</div>
  <div class="grid" id="t823g"></div>
  <div class="cnt">held &nbsp;<b id="t823h">361</b>&nbsp; / &nbsp;run &nbsp;<b id="t823r">0</b></div>
</div>
<script>
(function(){
  var root=document.getElementById('t823');
  var g=document.getElementById('t823g');
  var cols=18, rows=10, n=cols*rows;
  g.style.gridTemplateColumns='repeat('+cols+',8px)';
  var dots=[];
  for(var i=0;i<n;i++){
    var d=document.createElement('div');
    d.className='d';
    g.appendChild(d);
    dots.push(d);
    (function(dot){
      dot.addEventListener('click',function(e){
        e.stopPropagation();
        if(!dot.classList.contains('lit')){
          dot.classList.add('lit');
          var r=document.getElementById('t823r');
          var h=document.getElementById('t823h');
          r.textContent=(parseInt(r.textContent,10)+1);
          h.textContent=Math.max(0,parseInt(h.textContent,10)-1);
          var m=document.getElementById('t823m');
          m.classList.add('on');
          clearTimeout(root._mt);
          root._mt=setTimeout(function(){m.classList.remove('on');},1800);
        }
      });
    })(d);
  }
  root.addEventListener('mousemove',function(e){
    var rect=root.getBoundingClientRect();
    dots.forEach(function(d){
      if(d.classList.contains('lit'))return;
      var r=d.getBoundingClientRect();
      var dx=(r.left+4)-e.clientX, dy=(r.top+4)-e.clientY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<40)d.classList.add('near');
      else d.classList.remove('near');
    });
  });
  root.addEventListener('mouseleave',function(){
    dots.forEach(function(d){d.classList.remove('near');});
  });
})();
</script>
</section>
</body></html>
